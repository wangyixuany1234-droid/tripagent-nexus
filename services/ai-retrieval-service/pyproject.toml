[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-agent-ai"
version = "0.1.0"
description = "Private AI, OCR, retrieval, reranking, and graph service for TripAgent Nexus"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "lancedb==0.38.0",
  "neo4j==6.3.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "pillow==12.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
  "schemathesis==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "concurrency: bounded local concurrency and isolation tests",
  "security: authentication, injection, privacy, and input boundary tests",
]

[tool.coverage.run]
branch = true
source = ["trip_agent_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/trip_agent_ai/core/config.py" = ["S105"]
"tests/**/*.py" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
