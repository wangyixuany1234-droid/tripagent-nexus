          $ref: "#/components/schemas/PreferenceStatus"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    UserPreferenceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/UserPreference"
    SaveUserPreferenceRequest:
      type: object
      additionalProperties: false
      required: [category, value]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
          minLength: 1
          maxLength: 500

    TraceSpanCategory:
      type: string
      enum: [MODEL, RAG, AGENT, MCP, A2A, KAFKA]
    TraceSpan:
      type: object
      additionalProperties: false
      required: [spanId, category, name, status, startedAt, durationMs, attributes]
      properties:
        spanId:
          type: string
          minLength: 1
          maxLength: 32
        parentSpanId:
          type: [string, "null"]
          maxLength: 32
        category:
          $ref: "#/components/schemas/TraceSpanCategory"
        name:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [OK, ERROR, UNSET]
        startedAt:
          $ref: "#/components/schemas/Instant"
        durationMs:
          type: integer
          format: int64
          minimum: 0
        attributes:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
    DeveloperTrace:
      type: object
      additionalProperties: false
      required: [traceId, status, startedAt, durationMs, spans]
      properties:
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        status:
          type: string
          enum: [OK, ERROR, PARTIAL]
        startedAt:
          $ref: "#/components/schemas/Instant"
        durationMs:
          type: integer
          format: int64
          minimum: 0
        spans:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TraceSpan"

    FeedbackTargetType:
      type: string
      enum: [PLAN, PLACE, BUDGET, EVIDENCE]
    FeedbackSentiment:
      type: string
      enum: [LIKE, DISLIKE]
    FeedbackFields:
      type: object
      required: [tripId, rating, comment, tags]
      properties:
        tripId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        targetType:
          $ref: "#/components/schemas/FeedbackTargetType"
        targetId:
          type: string
          maxLength: 200
        sentiment:
          $ref: "#/components/schemas/FeedbackSentiment"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 5000
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            maxLength: 100
    CreateFeedbackRequest:
      allOf:
        - $ref: "#/components/schemas/FeedbackFields"
      unevaluatedProperties: false
    Feedback:
      allOf:
        - $ref: "#/components/schemas/FeedbackFields"
        - type: object
          required: [feedbackId, createdAt]
          properties:
            feedbackId:
              type: string
              format: uuid
            memoryAccepted:
              type: boolean
            createdAt:
              $ref: "#/components/schemas/Instant"
      unevaluatedProperties: false
    FeedbackList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Feedback"

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, traceId, timestamp]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        message:
          type: string
          maxLength: 1000
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        timestamp:
          $ref: "#/components/schemas/Instant"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        field:
          type: string
          description: RFC 6901 JSON Pointer
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        message:
          type: string
          maxLength: 500
