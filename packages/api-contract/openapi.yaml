openapi: 3.1.0
info:
  title: TripAgent Nexus Public API
  version: 1.0.0
  summary: Contract-first trip, plan, guarded action, evaluation, and operations API
  description: |
    Frozen Phase 10 public API served only by Spring Boot. All timestamps are RFC 3339 UTC
    instants unless a field is explicitly a calendar date. Monetary values use
    decimal semantics and map to Java BigDecimal and PostgreSQL NUMERIC(19,4).
  contact:
    name: TripAgent Nexus Engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
x-api-stability: frozen
x-api-version: v1
x-compatibility-policy:
  frozenFieldsCannotBeRemovedOrRenamed: true
  newFieldsMustBeOptional: true
  documentedErrorCodesRequired: true
  pathPrefix: /api/v1
servers:
  - url: /
    description: Same-origin Spring Boot API
tags:
  - name: System
    description: Public service availability and provider mode
  - name: Maps
    description: Server-proxied map resources for browser visualization
  - name: Trips
    description: Trip projects and requirements
  - name: Documents
    description: Asynchronous document parsing
  - name: Plans
    description: Travel plan generation, retrieval, replanning, and confirmation
  - name: Tasks
    description: Asynchronous task state and SSE progress
  - name: Workbench
    description: User-scoped task workspace projections
  - name: Preferences
    description: User-controlled travel preferences and inferred memory
  - name: Feedback
    description: User feedback for a trip or plan
  - name: Developer
    description: Protected and sanitized development diagnostics
  - name: Actions
    description: Human approval boundary for all real-cost or transactional actions
  - name: Evaluations
    description: Protected asynchronous Harness Engineering replay
  - name: Operations
    description: Protected asynchronous governance and dead-letter operations

security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      summary: Get public API availability and provider mode
      security: []
      responses:
        "200":
          description: Public API health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Get sanitized dependency and capability availability
      security: []
      responses:
        "200":
          description: Sanitized system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/maps/tiles/{zoom}/{x}/{y}.png:
    parameters:
      - $ref: "#/components/parameters/MapZoom"
      - $ref: "#/components/parameters/MapTileX"
      - $ref: "#/components/parameters/MapTileY"
    get:
      tags: [Maps]
      operationId: getMapTile
      summary: Get a cached world map tile through the backend allowlist
      security: []
      responses:
        "200":
          description: PNG map tile
          headers:
            Cache-Control:
              description: Browser cache policy inherited from the configured tile provider
              schema:
                type: string
            ETag:
              description: Provider entity tag when available
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/trips:
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create a trip project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/trips/{tripId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Get a trip project
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripId}/requirements:
    parameters:
      - $ref: "#/components/parameters/TripId"
    put:
      tags: [Trips]
      operationId: saveTravelRequirement
      summary: Create or replace the normalized travel requirement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTravelRequirementRequest"
      responses:
        "200":
          description: Saved requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelRequirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/documents/parse:
    post:
      tags: [Documents]
      operationId: parseDocument
      summary: Accept a document and queue asynchronous parsing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [tripId, file]
              properties:
                tripId:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG, WEBP, or PDF within configured byte, pixel, and page limits
      responses:
        "202":
          description: Document parsing accepted
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getParsedDocument
      summary: Get document parsing state and parsed bookings
      responses:
        "200":
          description: Parsed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{documentId}/retry:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Documents]
      operationId: retryDocumentParsing
      summary: Retry parsing for a failed document without uploading its content again
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Document parsing retry accepted
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/documents/{documentId}/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/BookingId"
    patch:
      tags: [Documents]
      operationId: correctParsedBooking
      summary: Correct extracted booking fields and append an immutable audit record
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCorrectionRequest"
      responses:
        "200":
          description: Corrected booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedBooking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/plans:
    post:
      tags: [Plans]
      operationId: createTravelPlan
      summary: Reserve a plan resource and queue asynchronous generation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTravelPlanRequest"
      responses:
        "202":
          description: Plan generation accepted
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Plans]
      operationId: getTravelPlan
      summary: Get one travel plan
      responses:
        "200":
          description: Travel plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripId}/plans:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      tags: [Plans]
      operationId: listTravelPlans
      summary: List plans belonging to a trip
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelPlanList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plans/{planId}/replan:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Plans]
      operationId: replanTravelPlan
      summary: Create a successor plan version and queue regeneration
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanRequest"
      responses:
        "202":
          description: Replanning accepted
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/plans/{planId}/compare/{otherPlanId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
      - name: otherPlanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Plans]
      operationId: compareTravelPlanVersions
      summary: Compare two immutable versions from the same plan family
      responses:
        "200":
          description: Version comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanComparison"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/plans/{planId}/confirm:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Plans]
      operationId: confirmTravelPlan
      summary: Confirm a generated travel plan without executing provider actions
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPlanRequest"
      responses:
        "200":
          description: Confirmed plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/feedback:
    get:
      tags: [Feedback]
      operationId: listFeedback
      summary: List feedback belonging to one trip
      parameters:
        - name: tripId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Feedback]
      operationId: createFeedback
      summary: Record user feedback for a trip or plan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "201":
          description: Feedback created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/workbench/tasks:
    get:
      tags: [Workbench]
      operationId: listWorkbenchTasks
      summary: List user-scoped travel tasks with filters
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: destination
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Filtered workbench tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbenchTaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/users/{userId}/preferences:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Preferences]
      operationId: listUserPreferences
      summary: List active and rejected preferences controlled by the user
      responses:
        "200":
          description: Preference list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferenceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Preferences]
      operationId: createUserPreference
      summary: Create a user-provided preference
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveUserPreferenceRequest"
      responses:
        "201":
          description: Preference created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/users/{userId}/preferences/{preferenceId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/PreferenceId"
    put:
      tags: [Preferences]
      operationId: updateUserPreference
      summary: Update a preference value
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveUserPreferenceRequest"
      responses:
        "200":
          description: Preference updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Preferences]
      operationId: deleteUserPreference
      summary: Delete a preference and request backend memory cleanup
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Preference deleted and cleanup requested
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userId}/preferences/{preferenceId}/reject:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/PreferenceId"
    post:
      tags: [Preferences]
      operationId: rejectInferredPreference
      summary: Reject an inferred preference and request backend memory cleanup
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Inferred preference rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get asynchronous task state
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{taskId}/events:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: Last-Event-ID
        in: header
        required: false
        description: Last processed event UUID. Later retained events are replayed.
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      operationId: streamTaskEvents
      summary: Stream persisted and live task progress
      responses:
        "200":
          description: |
            Server-Sent Events stream. The SSE `id` equals `eventId`; clients use
            `Last-Event-ID` to resume without replaying earlier events.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 018f0e31-6ec8-7a59-b871-0242ac120001
                event: task-progress
                data: {"eventId":"018f0e31-6ec8-7a59-b871-0242ac120001","taskId":"018f0e31-6ec8-7a59-b871-0242ac120002","stage":"QUEUED","progress":0,"message":"Task queued","timestamp":"2026-09-03T06:30:00Z"}
          x-sse-event-schema:
            $ref: "#/components/schemas/TaskEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Requested event is outside retained history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/tasks/{taskId}/agents:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: listTaskAgentExecutions
      summary: List backend-observed Agent execution states for a planning task
      responses:
        "200":
          description: Agent execution list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentExecutionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: cancelTask
      summary: Cancel a non-terminal task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/developer/traces/{traceId}:
    parameters:
      - name: traceId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
    get:
      tags: [Developer]
      operationId: getDeveloperTrace
      summary: Get a sanitized trace in development or for administrators
      responses:
        "200":
          description: Sanitized trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperTrace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/operations/dead-letters:
    get:
      tags: [Operations]
      operationId: listDeadLetters
      summary: List retained dead-letter events
      security:
        - OperationsToken: []
      parameters:
        - $ref: "#/components/parameters/OperationsToken"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DeadLetterStatus"
      responses:
        "200":
          description: Dead-letter records ordered by newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/operations/dead-letters/{deadLetterId}/replay:
    parameters:
      - $ref: "#/components/parameters/DeadLetterId"
    post:
      tags: [Operations]
      operationId: replayDeadLetter
      summary: Republish one retained dead-letter event
      security:
        - OperationsToken: []
      parameters:
        - $ref: "#/components/parameters/OperationsToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayDeadLetterRequest"
      responses:
        "202":
          description: Replay event accepted into the transactional outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/actions:
    post:
      tags: [Actions]
      operationId: proposeGuardedAction
      summary: Create a non-executable candidate action awaiting explicit user confirmation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuardedActionRequest"
      responses:
        "201":
          description: Candidate action created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/actions/{actionId}:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    get:
      tags: [Actions]
      operationId: getGuardedAction
      summary: Get a candidate action and its immutable audit trail
      parameters:
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Guarded action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/actions/{actionId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    post:
      tags: [Actions]
      operationId: confirmGuardedAction
      summary: Confirm an unexpired candidate after acknowledging its risk and exact cost
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmGuardedActionRequest"
      responses:
        "200":
          description: Confirmed action. Confirmation alone does not call a provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/actions/{actionId}/reject:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    post:
      tags: [Actions]
      operationId: rejectGuardedAction
      summary: Reject a candidate action and append an immutable audit record
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectGuardedActionRequest"
      responses:
        "200":
          description: Rejected action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/evaluations/runs:
    post:
      tags: [Evaluations]
      operationId: startEvaluationRun
      summary: Queue a versioned Harness Engineering dataset replay
      security:
        - OperationsToken: []
      parameters:
        - $ref: "#/components/parameters/OperationsToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvaluationRunRequest"
      responses:
        "202":
          description: Evaluation replay accepted
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/evaluations/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/EvaluationRunId"
    get:
      tags: [Evaluations]
      operationId: getEvaluationRun
      summary: Get aggregate metrics, sample outcomes, failures, and execution environment
      security:
        - OperationsToken: []
      parameters:
        - $ref: "#/components/parameters/OperationsToken"
      responses:
        "200":
          description: Evaluation run report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token validated against the configured issuer, audience, and JWK set
    OperationsToken:
      type: apiKey
      in: header
      name: X-Operations-Token
      description: Backend-only operations credential injected from a secret store

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key scoped to operation and authenticated actor
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    OperationsToken:
      name: X-Operations-Token
      in: header
      required: true
      description: Backend-only operations credential injected from a secret store
      schema:
        type: string
        minLength: 32
        maxLength: 256
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreferenceId:
      name: preferenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      deprecated: true
      description: Legacy compatibility field; ignored for authorization when JWT authentication is enabled
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:@-]+$"
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeadLetterId:
      name: deadLetterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapZoom:
      name: zoom
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 19
    MapTileX:
      name: x
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 524287
    MapTileY:
      name: y
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 524287

  headers:
    Location:
      description: Canonical URL for the resource
      schema:
        type: string
        format: uri-reference

  responses:
    BadRequest:
      description: Malformed request or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found in the authorized scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Idempotency, state, or version conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: Domain or field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: Uploaded document exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: Uploaded MIME type or extension is not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication credential is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated actor is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Operations rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadGateway:
      description: Configured upstream provider failed or returned an invalid response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion, providerMode, timestamp]
      properties:
        status:
          type: string
          enum: [UP]
        service:
          type: string
          maxLength: 100
        apiVersion:
          type: string
          pattern: "^v[0-9]+$"
        providerMode:
          type: string
          enum: [LIVE, MOCK]
          description: MOCK when any user-facing planning provider runs in mock mode
        timestamp:
          $ref: "#/components/schemas/Instant"
    AvailabilityStatus:
      type: string
      enum: [AVAILABLE, DEGRADED, UNAVAILABLE, DISABLED]
    SystemDependency:
      type: object
      additionalProperties: false
      required: [key, label, status]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,49}$"
        label:
          type: string
          maxLength: 100
        status:
          $ref: "#/components/schemas/AvailabilityStatus"
    SystemCapability:
      type: object
      additionalProperties: false
      required: [key, label, status]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,49}$"
        label:
          type: string
          maxLength: 100
        status:
          $ref: "#/components/schemas/AvailabilityStatus"
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        [status, providerMode, modelProvider, developerToolsEnabled, dependencies, capabilities, checkedAt]
      properties:
        status:
          $ref: "#/components/schemas/AvailabilityStatus"
        providerMode:
          type: string
          enum: [LIVE, MOCK]
        modelProvider:
          type: string
          maxLength: 100
        developerToolsEnabled:
          type: boolean
        dependencies:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SystemDependency"
        capabilities:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SystemCapability"
        checkedAt:
          $ref: "#/components/schemas/Instant"

    DecimalAmount:
      type: number
      format: decimal
      multipleOf: 0.0001
      minimum: 0
      examples: [12500.0000]
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      examples: [CNY]
    Instant:
      type: string
      format: date-time
      description: RFC 3339 UTC instant
      examples: ["2026-09-03T06:30:00Z"]
    TimeZone:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA time zone used only for display and local scheduling
      examples: [Asia/Shanghai]
    Pace:
      type: string
      enum: [RELAXED, BALANCED, INTENSIVE]
    TransportMode:
      type: string
      enum: [WALK, TRANSIT, TAXI, CAR, BIKE, RAIL, FLIGHT, BUS, FERRY]
    Place:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        placeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 300
        address:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Traveler:
      type: object
      additionalProperties: false
      required: [travelerId, displayName, type]
      properties:
        travelerId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [ADULT, CHILD, INFANT, SENIOR]
        accessibilityNeeds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100

    UserProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - preferredPace
        - interests
        - dietaryRestrictions
        - accommodationPreferences
        - transportPreferences
        - budgetHabits
      properties:
        userId:
          type: string
          format: uuid
        preferredPace:
          $ref: "#/components/schemas/Pace"
        interests:
          type: array
          uniqueItems: true
          items:
            type: string
        dietaryRestrictions:
          type: array
          uniqueItems: true
          items:
            type: string
        accommodationPreferences:
          type: array
          uniqueItems: true
          items:
            type: string
        transportPreferences:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TransportMode"
        budgetHabits:
          type: array
          uniqueItems: true
          items:
            type: string

    TripStatus:
      type: string
      enum: [DRAFT, READY, ARCHIVED]
    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [userId, title, timeZone]
      properties:
        userId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        timeZone:
          $ref: "#/components/schemas/TimeZone"
    Trip:
      type: object
      additionalProperties: false
      required: [tripId, userId, title, timeZone, status, createdAt, updatedAt]
      properties:
        tripId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        status:
          $ref: "#/components/schemas/TripStatus"
        requirement:
          $ref: "#/components/schemas/TravelRequirement"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    TravelRequirementFields:
      type: object
      required:
        - origin
        - destinations
        - startDate
        - endDate
        - travelers
        - totalBudget
        - currency
        - interests
        - pace
        - mustVisit
        - avoid
        - freeTextConstraints
      properties:
        origin:
          $ref: "#/components/schemas/Place"
        destinations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/Place"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        travelers:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Traveler"
        totalBudget:
          $ref: "#/components/schemas/DecimalAmount"
        currency:
          $ref: "#/components/schemas/Currency"
        interests:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            maxLength: 100
        pace:
          $ref: "#/components/schemas/Pace"
        mustVisit:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            maxLength: 200
        avoid:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            maxLength: 200
        freeTextConstraints:
          type: string
          maxLength: 5000
    SaveTravelRequirementRequest:
      allOf:
        - $ref: "#/components/schemas/TravelRequirementFields"
      unevaluatedProperties: false
    TravelRequirement:
      allOf:
        - $ref: "#/components/schemas/TravelRequirementFields"
        - type: object
          required: [tripId, updatedAt]
          properties:
            tripId:
              type: string
              format: uuid
            updatedAt:
              $ref: "#/components/schemas/Instant"
      unevaluatedProperties: false

    BookingType:
      type: string
      enum: [FLIGHT, HOTEL, TICKET, TRAIN, OTHER]
    BookingReviewStatus:
      type: string
      enum: [AUTO_ACCEPTED, NEEDS_REVIEW, CORRECTED]
    ExtractedFieldStatus:
      type: string
      enum: [EXTRACTED, LOW_CONFIDENCE, MISSING, CORRECTED]
    BookingField:
      type: string
      enum:
        - type
        - provider
        - origin
        - destination
        - hotelName
        - hotelAddress
        - transportNumber
        - startTime
        - endTime
        - travelerCount
        - amount
        - currency
        - confirmationNumber
    EvidenceRegion:
      type: object
      additionalProperties: false
      required: [page, x, y, width, height]
      properties:
        page:
          type: integer
          minimum: 1
        x:
          type: number
          format: decimal
          minimum: 0
          maximum: 1
        y:
          type: number
          format: decimal
          minimum: 0
          maximum: 1
        width:
          type: number
          format: decimal
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          format: decimal
          exclusiveMinimum: 0
          maximum: 1
    ExtractedFieldEvidence:
      type: object
      additionalProperties: false
      required: [field, confidence, status]
      description: |
        Field-level OCR evidence. Non-missing fields should include textEvidence, region,
        or both; this cross-field rule is enforced by the backend validator.
      properties:
        field:
          $ref: "#/components/schemas/BookingField"
        confidence:
          type: number
          format: decimal
          minimum: 0
          maximum: 1
          multipleOf: 0.0001
        status:
          $ref: "#/components/schemas/ExtractedFieldStatus"
        textEvidence:
          type: string
          maxLength: 1000
        region:
          $ref: "#/components/schemas/EvidenceRegion"
    BookingValidationIssue:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
          enum:
            - END_BEFORE_START
            - OUTSIDE_TRIP_DATES
            - DUPLICATE_CONFIRMATION
            - AMOUNT_OR_CURRENCY_MISSING
            - LOW_CONFIDENCE_CRITICAL_FIELD
            - MUTUALLY_EXCLUSIVE_TIME_OVERLAP
        field:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 500
    BookingCorrectionAudit:
      type: object
      additionalProperties: false
      required:
        [auditId, field, originalValue, correctedValue, actorId, correctedAt]
      properties:
        auditId:
          type: string
          format: uuid
        field:
          $ref: "#/components/schemas/BookingField"
        originalValue:
          type: string
          maxLength: 2000
        correctedValue:
          type: string
          maxLength: 2000
        actorId:
          type: string
          maxLength: 128
        reason:
          type: string
          maxLength: 500
        correctedAt:
          $ref: "#/components/schemas/Instant"
    BookingFieldCorrection:
      type: object
      additionalProperties: false
      required: [field, value]
      properties:
        field:
          $ref: "#/components/schemas/BookingField"
        value:
          type: string
          maxLength: 2000
    BookingCorrectionRequest:
      type: object
      additionalProperties: false
      required: [corrections]
      properties:
        corrections:
          type: array
          minItems: 1
          maxItems: 13
          items:
            $ref: "#/components/schemas/BookingFieldCorrection"
        reason:
          type: string
          maxLength: 500
    ParsedBooking:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - type
        - sourceDocumentId
        - confidence
        - missingFields
        - reviewStatus
        - fieldEvidence
        - validationIssues
        - corrections
      properties:
        bookingId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/BookingType"
        sourceDocumentId:
          type: string
          format: uuid
        provider:
          type: string
          maxLength: 200
        origin:
          type: string
          maxLength: 300
        destination:
          type: string
          maxLength: 300
        hotelName:
          type: string
          maxLength: 300
        hotelAddress:
          type: string
          maxLength: 500
        transportNumber:
          type: string
          maxLength: 100
        confirmationNumber:
          type: string
          maxLength: 200
        startTime:
          $ref: "#/components/schemas/Instant"
        endTime:
          $ref: "#/components/schemas/Instant"
        travelerCount:
          type: integer
          minimum: 1
          maximum: 100
        amount:
          $ref: "#/components/schemas/DecimalAmount"
        currency:
          $ref: "#/components/schemas/Currency"
        confidence:
          type: number
          format: decimal
          minimum: 0
          maximum: 1
          multipleOf: 0.0001
        missingFields:
          type: array
          uniqueItems: true
          items:
            type: string
        reviewStatus:
          $ref: "#/components/schemas/BookingReviewStatus"
        fieldEvidence:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExtractedFieldEvidence"
        validationIssues:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BookingValidationIssue"
        corrections:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BookingCorrectionAudit"
    DocumentStatus:
      type: string
      enum: [QUEUED, PARSING, NEEDS_REVIEW, PARSED, FAILED, CANCELLED]
    ParsedDocument:
      type: object
      additionalProperties: false
      required:
        - documentId
        - tripId
        - fileName
        - mediaType
        - sizeBytes
        - sha256
        - pageCount
        - status
        - bookings
        - createdAt
        - updatedAt
      properties:
        documentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pageCount:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/DocumentStatus"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/ParsedBooking"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    PlanStatus:
      type: string
      enum: [GENERATING, READY, PARTIAL, FAILED, CONFIRMED, CANCELLED]
    PlanStrategy:
      type: string
      enum: [BUDGET, BALANCED, COMFORT, LOW_TRANSIT, CUSTOM]
    CreateTravelPlanRequest:
      type: object
      additionalProperties: false
      required: [tripId]
      properties:
        tripId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
    ReplanRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        freeTextConstraints:
          type: string
          maxLength: 5000
        lockedItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        removedItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        adjustedTotalBudget:
          $ref: "#/components/schemas/DecimalAmount"
        adjustedPace:
          type: string
          enum: [RELAXED, BALANCED, INTENSIVE]
        addedPreferences:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        naturalLanguageRequest:
          type: string
          maxLength: 5000
    ConfirmPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    TravelPlan:
      type: object
      additionalProperties: false
      required:
        - planId
        - planFamilyId
