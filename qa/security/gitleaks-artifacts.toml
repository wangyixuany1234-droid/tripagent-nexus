title = "Stage 8 built artifact and evidence scan"

[extend]
useDefault = true

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek key-shaped credential"
regex = '''(?i)(?:sk|deepseek)-[A-Za-z0-9][A-Za-z0-9_-]{20,}'''
keywords = ["sk-", "deepseek-"]

[[rules]]
id = "authorization-bearer-token"
description = "Embedded bearer credential"
regex = '''(?i)authorization["']?\s*[:=]\s*["']?bearer\s+[A-Za-z0-9._~+/=-]{16,}'''
keywords = ["authorization", "bearer"]
